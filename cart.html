<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - ModiZone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <style>
        /* Basic styling for the cart table */
        .cart-container { padding: 2rem 9%; margin-top: 80px; }
        .cart-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .cart-table th, .cart-table td { padding: 15px; text-align: left; border-bottom: 1px solid #ddd; }
        .cart-total { text-align: right; margin-top: 20px; }
        .btn-checkout {
            display: inline-block;
            background-color: #ff8c00; 
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html">
            <img src="image/logo.png" alt="ModiZone">
        </a>
        <i class="fa-solid fa-bars" id="menu-icon"></i>
        
        <ul class="navbar">
            <li><a href="index.html">Home</a></li>
            <li><a href="shopnow.html">Shop Now</a></li>
        </ul>

        <div class="header-icon">
            <i class="fa fa-solid fa-magnifying-glass" id="search-icon"></i>
            <i class="fa fa-solid fa-user" id="user-icon"></i>
            <a href="cart.html" style="text-decoration:none;">
                <i class="fa fa-solid fa-cart-shopping"></i>
                <span id="cart-count" style="background:red; color:white; font-size:12px; border-radius:50%; padding:2px 5px; vertical-align:top;">0</span>
            </a>
        </div>
    </header>
  <section class="home" id="home">
    <section class="cart-container">
        <center><h1>Your Shopping Cart</h1></center>
        
        <table class="cart-table">
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="cart-items">
                </tbody>
        </table>

        <div class="cart-total">
            <h3>Total: <span id="cart-total-price">$0.00</span></h3>
            <br>
            <a href="checkout.html" class="btn-checkout">Proceed to Checkout</a>
        </div>
    </section>
   </section> 

    <script src="script.js"></script>
</body>
</html>
