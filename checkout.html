<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModiZone Checkout</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <style>
        /* Styles for the new Order Summary Box */
        .order-summary {
            background-color: #f9f9f9;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: left;
        }
        .order-summary h3 { margin-bottom: 10px; border-bottom: 1px solid #ccc; padding-bottom: 5px; }
        .order-summary p { font-size: 1rem; margin: 5px 0; display: flex; justify-content: space-between; }
        .total-highlight { font-weight: bold; color: #d32f2f; font-size: 1.2rem; border-top: 1px dashed #ccc; padding-top:10px; margin-top:10px;}
        .checkout-container { margin-top: 80px; } /* Prevents hiding behind header */
    </style>
</head>
<body>
    <header>
        <a href="index.html">
            <img src="image/logo.png" alt="">
        </a>
        <i class="fa-solid fa-bars" id="menu-icon"></i>
        <ul class="navbar">
            <li><a href="index.html">Home</a></li>
            <li><a href="shopnow.html">Shop now</a></li>
            <li><a href="cart.html">Cart</a></li>
        </ul>

        <div class="header-icon">
            <i class="fa fa-solid fa-magnifying-glass" id="search-icon"></i>
            <i class="fa fa-solid fa-user" id="user-icon"></i>
        </div>
    </header>
   <section class="home" id="home">
    <section class="checkout-container">
        <div class="checkout-bg">
            <div class="checkout">
                <h2>Checkout to order</h2>
                
                <div class="order-summary">
                    <h3>Order Summary</h3>
                    <p>Total Items: <span id="checkout-item-count">0</span></p>
                    <p class="total-highlight">Total to Pay: <span id="checkout-total">$0.00</span></p>
                </div>

                <form id="checkoutForm">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>

                    <label for="address">Address :</label>
                    <input type="text" id="address" name="address" placeholder="Enter your Address" required>

                    <label for="phonenumber">Phone Number:</label>
                    <input type="text" id="phonenumber" name="phonenumber" placeholder="Enter your phone number" required>

                    <button type="submit">Confirm Order (COD)</button>
                </form>
            </div>
        </div>
    </section>
    </section>
    
    <script src="script.js"></script>
</body>
</html>
